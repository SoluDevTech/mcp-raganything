[project]
name = "mcp-raganything"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiofiles>=24.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.124.0",
    "fastmcp>=3.3.1,<3.4",
    "cryptography>=48.0.1",
    "httpx>=0.27.0",
    "kreuzberg>=4.9.9",
    "langchain-core>=1.3.3",
    "langchain-openai>=1.1.12",
    "langchain-postgres>=0.0.17",
    "langsmith>=0.8.18",
    "mcp>=1.28.1",
    "minio>=7.2.18",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.27",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml"
pythonpath = ["src"]


[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = ["E501", "B008", "ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["src"]